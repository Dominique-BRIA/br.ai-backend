name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Bouton « Run workflow » de l'onglet Actions : redéployer sans nouveau commit.
  workflow_dispatch:

# Deux déploiements ne se chevauchent jamais ; le plus récent attend la fin du précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Après chaque push sur main dont la vérification passe, ou à la demande (Run workflow) :
  # le serveur part sur Azure App Service.
  # Reste inactif tant que la variable AZURE_WEBAPP_NAME n'est pas définie dans le dépôt
  # (Settings → Secrets and variables → Actions → Variables).
  deployer:
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Le paquet ne contient que ce qui sert à l'exécution : le bundle, les migrations et les
      # dépendances de production. Le protocole est intégré au bundle, mais npm ci a besoin de
      # son dossier pour lire le fichier de verrouillage de l'espace de travail.
      - name: Préparer le paquet
        run: |
          mkdir -p paquet/packages
          cp -r dist drizzle package.json package-lock.json paquet/
          cp -r packages/protocol paquet/packages/
          cd paquet && npm ci --omit=dev --ignore-scripts

      - name: Déployer sur Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: paquet

      # Le serveur applique les migrations au démarrage : on attend qu'il réponde, base comprise.
      - name: Vérifier que le serveur répond
        if: vars.API_URL != ''
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "${{ vars.API_URL }}/health" || true)
            echo "Essai $attempt : ${body:-pas de réponse}"
            case "$body" in *'"database":"ok"'*) exit 0;; esac
            sleep 10
          done
          echo "Le serveur ne répond pas correctement après 5 minutes."
          exit 1
